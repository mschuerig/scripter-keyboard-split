name: test

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
            - name: Run tests
              run: bun test
            - name: Rebuild Scripter file
              run: bun run build
            - name: Verify committed scripter-keyboard-split.js matches build output
              run: git diff --exit-code scripter-keyboard-split.js
